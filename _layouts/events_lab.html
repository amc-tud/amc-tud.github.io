---
layout: default
---

<style>

.team-profile {
  display: flex;
  align-items: flex-start;
  gap: 30px;
  margin-top: 150px;
}

.team-profile img {
  max-width: 200px;
  height: auto;
  border-radius: 10px;
}

.team-profile .info {
  max-width: 600px;
}


/* ==========================
   Lab Events Page
   ========================== */

<style>

.events-page {
  max-width: 1100px;
  margin: 150px auto 80px;
  padding: 0 40px;
  font-size: 1.15rem;
}


/* Page title */

.events-page:before {
  content: "Lab Life";
  display: block;
  text-align: center;
  font-size: 3.5rem;
  font-weight: 700;
  margin-bottom: 70px;
  color: #222;
}


/* Event cards */

.event-section {
  background: #ffffff;
  padding: 50px;
  margin-bottom: 50px;
  border-radius: 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}


.event-section h2 {
  font-size: 2.4rem;
  font-weight: 700;
  margin-bottom: 15px;
  color: #222;
}


.event-date {
  display: block;
  font-size: 1.2rem;
  color: #777;
  margin-bottom: 30px;
}


.event-description {
  font-size: 1.2rem;
  line-height: 1.8;
  color: #333;
}


/* Speaker entries */

.speaker-list {
  margin-top: 45px;
}


.speaker {
  background: #fafafa;
  border-left: 5px solid #555;
  padding: 30px;
  margin-bottom: 30px;
  border-radius: 0 15px 15px 0;
}


.speaker h3 {
  font-size: 1.6rem;
  margin-bottom: 10px;
}


.speaker .institution {
  font-size: 1.15rem;
  color: #666;
  font-style: italic;
}


.speaker p {
  font-size: 1.15rem;
  line-height: 1.8;
}


/* Mobile */

@media (max-width: 700px) {

  .events-page {
    padding: 0 20px;
  }

  .event-section {
    padding: 30px;
  }

  .event-section h2 {
    font-size: 1.8rem;
  }

  .event-description,
  .speaker p {
    font-size: 1.05rem;
  }

}

</style>

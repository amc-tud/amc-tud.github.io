---
layout: default
---

<style>

.team-profile {
  display: flex;
  align-items: flex-start;
  gap: 30px;
  margin-top: 150px;
}

.team-profile img {
  max-width: 200px;
  height: auto;
  border-radius: 10px;
}

.team-profile .info {
  max-width: 600px;
}


/* ==========================
   Lab Events Page
   ========================== */

.events-page {
  max-width: 1000px;
  margin: 150px auto 80px;
  padding: 0 30px;
}


.event-section {
  background: #ffffff;
  padding: 40px;
  margin-bottom: 45px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
}


.event-section h2 {
  font-size: 2rem;
  font-weight: 600;
  margin-bottom: 10px;
  color: #222;
}


.event-date {
  display: block;
  font-size: 20px;
  color: #777;
  margin-bottom: 25px;
  font-weight: 500;
}


.event-description {
  font-size: 20px;
  line-height: 1.7;
  color: #444;
}


/* Speaker section */

.speaker-list {
  margin-top: 35px;
}


.speaker {
  background: #fafafa;
  border-left: 4px solid #555;
  padding: 20px 25px;
  margin-bottom: 25px;
  border-radius: 0 12px 12px 0;
}


.speaker h3 {
  margin-top: 0;
  margin-bottom: 8px;
  font-size: 1.25rem;
}


.speaker .institution {
  color: #777;
  font-style: italic;
  margin-bottom: 12px;
}


.speaker p {
  line-height: 1.6;
}



</style>


<div class="container">

  <div class="events-page">

    {{ content }}

  </div>

</div>  



</style>

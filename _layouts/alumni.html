---
layout: default

<style>
.alumni-page {
  max-width: 800px;
  margin: 120px auto 80px;
  padding: 0 25px;
}

.alumni-header {
  text-align: center;
  margin-bottom: 40px;
}

.alumni-header h2 {
  font-size: 2.5rem;
  font-weight: 700;
  margin-bottom: 10px;
}

.alumni-header p {
  color: #666;
  margin: 0;
}

.alumni-content h2 {
  margin-top: 40px;
  font-size: 1.5rem;
  color: #f28f3b;
}

.alumni-content h3 {
  margin: 25px 0 5px;
  font-size: 1.5rem;
  font-weight: 600;
  color: #2c363f;
}

.alumni-content p {
  margin: 0 0 10px;
  color: #555;
}

.alumni-content em {
  color: #777;
}

.alumni-content ul {
  margin: 0;
  padding-left: 20px;
}

.alumni-content li {
  margin-bottom: 8px;
}
</style>

<div class="alumni-page">

  <div class="alumni-header">
    <h2>{{ page.title }}</h2>
    <p>Former members of the lab and their current positions</p>
  </div>

  <div class="alumni-content">
    {{ content }}
  </div>

</div>

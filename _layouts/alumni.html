
---
layout: default
---

<style>
.alumni-page {
  max-width: 1000px;
  margin: 120px auto 80px;
  padding: 0 25px;
}

.alumni-header {
  text-align: center;
  margin-bottom: 50px;
}

.alumni-header h1 {
  font-size: 3rem;
  font-weight: 700;
}

.alumni-content h2 {
  margin-top: 50px;
  font-size: 1.8rem;
  border-bottom: 2px solid #eee;
  padding-bottom: 10px;
}

.alumni-content h3 {
  margin-bottom: 5px;
  font-size: 1.8rem;
}

.alumni-content h3::before {
  content: "";
}

.alumni-content p {
  margin-top: 5px;
  color: #555;
}

.alumni-content em {
  color: #777;
}

.alumni-content ul {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap: 12px;
  padding: 0;
  list-style: none;
}

.alumni-content li {
  background: #f8f9fb;
  padding: 15px 18px;
  border-radius: 12px;
  transition: transform .2s ease, box-shadow .2s ease;
}

.alumni-content li:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,.08);
}

.alumni-content h3 {
  background: white;
  padding: 20px 25px 5px;
  margin-top: 25px;
  border-radius: 16px 16px 0 0;
}

.alumni-content h3 + p {
  background: white;
  padding: 0 25px 20px;
  margin-bottom: 0;
}

.alumni-content h3 + p + p {
  background: white;
  padding: 0 25px 20px;
  border-radius: 0 0 16px 16px;
}

</style>


<div class="alumni-page">

  <div class="alumni-header">
    <h2>{{ page.title }}</h2>
    <p>Former members of the lab and their current positions</p>
  </div>

  <div class="alumni-content">
    {{ content }}
  </div>

</div>

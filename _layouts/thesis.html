---
layout: default
---

<style>
.thesis-page {
  max-width: 1000px;
  margin: 120px auto 80px;
  padding: 0 25px;
}

/* Header */
.thesis-header {
  text-align: center;
  margin-bottom: 55px;
}

.thesis-header h1 {
  font-size: 3rem;
  font-weight: 700;
  margin-bottom: 12px;
}

.thesis-header p {
  color: #666;
  font-size: 1.05rem;
  margin: 5px 0;
}

.thesis-updated {
  font-size: 0.9rem !important;
  color: #999 !important;
  margin-top: 12px !important;
}


/* Main content */
.thesis-content {
  color: #555;
  line-height: 1.7;
}


/* Bachelor / Master sections */
.thesis-content h2 {
  margin-top: 65px;
  margin-bottom: 30px;
  padding-bottom: 12px;
  border-bottom: 2px solid #eee;
  color: #222;
  font-size: 2rem;
  font-weight: 700;
}

.thesis-content h2:first-child {
  margin-top: 0;
}


/* Thesis cards */
.thesis-content h3 {
  background: white;
  margin: 30px 0 0;
  padding: 25px 30px 8px;

  border-radius: 16px 16px 0 0;

  color: #222;
  font-size: 1.4rem;
  line-height: 1.4;
  font-weight: 700;

  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
}


/* Supervisor */
.thesis-content h3 + p {
  background: white;
  margin: 0;
  padding: 5px 30px 18px;

  color: #777;
  font-size: 0.95rem;

  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
}

.thesis-content h3 + p strong {
  color: #444;
}

.thesis-content h3 + p a {
  color: inherit;
  text-decoration: none;
}

.thesis-content h3 + p a:hover {
  text-decoration: underline;
}


/* Description */
.thesis-content h3 + p + p {
  background: white;
  margin: 0;
  padding: 0 30px 25px;

  color: #555;
  line-height: 1.75;

  border-radius: 0 0 16px 16px;

  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
}


/*
 * Additional paragraphs in a thesis description.
 * These continue the same white card.
 */
.thesis-content h3 + p + p ~ p {
  color: #555;
  line-height: 1.75;
}


/* Horizontal rules between topics */
.thesis-content hr {
  border: 0;
  height: 0;
  margin: 0;
}


/* General links */
.thesis-content a {
  color: inherit;
}


/* Lists inside thesis descriptions */
.thesis-content ul,
.thesis-content ol {
  margin: 10px 30px 25px;
  line-height: 1.7;
}


/* Mobile */
@media (max-width: 700px) {

  .thesis-page {
    margin: 80px auto 60px;
    padding: 0 18px;
  }

  .thesis-header {
    margin-bottom: 40px;
  }

  .thesis-header h1 {
    font-size: 2.2rem;
  }

  .thesis-header p {
    font-size: 1rem;
  }

  .thesis-content h2 {
    font-size: 1.6rem;
    margin-top: 50px;
  }

  .thesis-content h3 {
    padding: 20px 20px 8px;
    font-size: 1.25rem;
  }

  .thesis-content h3 + p {
    padding: 5px 20px 18px;
  }

  .thesis-content h3 + p + p {
    padding: 0 20px 22px;
  }

  .thesis-content ul,
  .thesis-content ol {
    margin-left: 20px;
    margin-right: 20px;
  }
}
</style>


<div class="thesis-page">

  <header class="thesis-header">

    <h1>{{ page.title }}</h1>

    <p>AMC Thesis Projects @ TUD</p>

    <p>Chair of Biopsychology, TU Dresden</p>

    <p class="thesis-updated">
      Last updated: 2025/11/06
    </p>

  </header>


  <main class="thesis-content">

    {{ content }}

  </main>

</div>
